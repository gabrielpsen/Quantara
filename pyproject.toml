[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quantara"
dynamic = ["version"]
description = "Neural-network quantization toolkit in pure NumPy"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["quantization", "gptq", "awq", "llm", "int4", "machine-learning"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
llm = ["tokenizers>=0.15"]
dev = ["pytest>=7", "ruff>=0.5", "mypy>=1.8", "tokenizers>=0.15"]

[project.scripts]
quantara = "quantara.cli:main"

[tool.setuptools.packages.find]
include = ["quantara*"]

[tool.setuptools.package-data]
quantara = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "quantara._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py39"
extend-exclude = ["scratch", "out", "results"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["E731", "B905", "SIM108", "UP006", "UP007", "UP035", "UP045", "RUF012", "RUF005", "E741", "B028"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["B", "SIM", "RUF"]
"quantara/llm/checkpoint.py" = ["SIM115"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["scratch", "build"]
